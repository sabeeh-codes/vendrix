<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendrix — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="nav-logo">
    <img src="assets/logo/vendrix-logo.png" alt="Vendrix"
         onerror="this.style.display='none';document.querySelector('.nav-logo-text').style.display='block'">
    <span class="nav-logo-text" style="display:none">Vendrix</span>
  </div>
  <div class="nav-links">
    <a href="index.html">Browse Products</a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <img src="assets/logo/vendrix-logo.png" alt="Vendrix"
           onerror="this.style.display='none'">
      <h1>Vendrix</h1>
      <p>Your premium clothing destination</p>
    </div>

    <div class="auth-tabs">
      <button class="active" id="tab-login">Sign In</button>
      <button id="tab-register">Create Account</button>
    </div>

    <div id="alert" style="display:none"></div>

    <!-- login form section -->
    <div id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email"
               placeholder="your@email.com"
               autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password"
               placeholder="Enter your password"
               autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-lg"
              style="width:100%"
              id="login-btn">Sign In</button>
    </div>

    <!-- register form (hidden by default) -->
    <div id="register-form" style="display:none">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="reg-username"
               placeholder="Choose a username">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="reg-email"
               placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password"
               placeholder="Minimum 6 characters">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="reg-password2"
               placeholder="Repeat your password">
      </div>
      <button class="btn btn-primary btn-lg"
              style="width:100%"
              id="register-btn">Create Account</button>
    </div>

  </div>
</div>

<script src="api.js"></script>
<script src="auth.js"></script>
</body>
</html>
