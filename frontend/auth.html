<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendrix — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="nav-logo">
    <img src="assets/logo/vendrix-logo.png" alt="Vendrix"
         onerror="this.style.display='none';
                  document.querySelector('.nav-logo-text').style.display='block'">
    <span class="nav-logo-text" style="display:none">Vendrix</span>
  </div>
  <div class="nav-links">
    <a href="index.html">Browse Products</a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <img src="assets/logo/vendrix-logo.png" alt="Vendrix"
           onerror="this.style.display='none'">
      <h1>Vendrix</h1>
      <p>Your premium clothing destination</p>
    </div>

    <!-- Tabs use onclick directly -->
    <div class="auth-tabs">
      <button class="active" id="tab-login"
              onclick="showTab('login')">Sign In</button>
      <button id="tab-register"
              onclick="showTab('register')">Create Account</button>
    </div>

    <div id="alert" style="display:none"></div>

    <!-- Login form -->
    <div id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <!-- Use email type here -->
        <input type="email"
               id="login-email"
               placeholder="your@email.com"
               autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password"
               id="login-password"
               placeholder="Enter your password"
               autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-lg"
              style="width:100%"
              id="login-btn"
              onclick="handleLogin()">
        Sign In
      </button>
    </div>

    <!-- Register form -->
    <div id="register-form" style="display:none">
      <div class="form-group">
        <label>Username</label>
        <input type="text"
               id="reg-username"
               placeholder="Choose a username"
               autocomplete="username">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email"
               id="reg-email"
               placeholder="your@email.com"
               autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password"
               id="reg-password"
               placeholder="Minimum 6 characters">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password"
               id="reg-password2"
               placeholder="Repeat your password">
      </div>
      <button class="btn btn-primary btn-lg"
              style="width:100%"
              id="register-btn"
              onclick="handleRegister()">
        Create Account
      </button>
    </div>

  </div>
</div>

<script src="api.js"></script>
<script>

  // Already logged in, skip this page
  if (isLoggedIn()) window.location.href = 'index.html';

  // Tab switching
  function showTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('login-form').style.display    = isLogin ? 'block' : 'none';
    document.getElementById('register-form').style.display = isLogin ? 'none'  : 'block';
    document.getElementById('tab-login').classList.toggle('active',    isLogin);
    document.getElementById('tab-register').classList.toggle('active', !isLogin);
    document.getElementById('alert').style.display = 'none';
  }

  // Alert helper
  function showAlert(msg, type = 'error') {
    const el       = document.getElementById('alert');
    el.className   = `alert alert-${type}`;
    el.textContent = msg;
    el.style.display = 'block';
  }

  // Login
  async function handleLogin() {
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    if (!email || !password) {
      return showAlert('Please fill in all fields.');
    }

    const btn       = document.getElementById('login-btn');
    btn.textContent = 'Signing in...';
    btn.disabled    = true;

    try {
      // api.js login() sends email to backend
      // backend returns { access, refresh, username, email }
      // api.js saves username to localStorage
      await login(email, password);

      // Go to products page
      window.location.href = 'index.html';

    } catch (err) {
      showAlert(err.message);
      btn.textContent = 'Sign In';
      btn.disabled    = false;
    }
  }

  // Register
  async function handleRegister() {
    const username  = document.getElementById('reg-username').value.trim();
    const email     = document.getElementById('reg-email').value.trim();
    const password  = document.getElementById('reg-password').value;
    const password2 = document.getElementById('reg-password2').value;

    if (!username || !email || !password || !password2) {
      return showAlert('Please fill in all fields.');
    }

    if (password !== password2) {
      return showAlert('Passwords do not match.');
    }

    const btn       = document.getElementById('register-btn');
    btn.textContent = 'Creating account...';
    btn.disabled    = true;

    try {
      await register(username, email, password, password2);

      // Auto-fill email so user can sign in
      showAlert('Account created! Please sign in.', 'success');
      document.getElementById('login-email').value = email;
      showTab('login');

    } catch (err) {
      showAlert(err.message);
    } finally {
      btn.textContent = 'Create Account';
      btn.disabled    = false;
    }
  }

  // Enter key
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const loginVisible =
      document.getElementById('login-form').style.display !== 'none';
    loginVisible ? handleLogin() : handleRegister();
  });

</script>
</body>
</html>
