<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendrix - Shop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .size-btn {
      display: inline-block;
      padding: 5px 12px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--white);
      color: var(--text-muted);
      transition: all 0.15s;
      user-select: none;
    }
    .size-btn:hover  { border-color: var(--primary); color: var(--primary); }
    .size-btn.selected {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .color-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      display: inline-block;
      transition: transform 0.15s;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
    }
    .color-btn:hover { transform: scale(1.15); }
    .color-btn.selected {
      border: 2px solid var(--dark);
      box-shadow: 0 0 0 2px white, 0 0 0 4px var(--dark);
    }

    .qty-wrap {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--white);
    }
    .qty-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--bg);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .qty-btn:hover    { background: var(--border); }
    .qty-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .qty-num {
      width: 34px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      background: var(--white);
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: #fafbfc;
    }
    .card-price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px 4px;
    }
    .variants-section {
      padding: 0 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .variant-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .size-btns  { display: flex; gap: 5px; flex-wrap: wrap; }
    .color-btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">
    <img src="assets/logo/vendrix-logo.png" alt="Vendrix"
         onerror="this.style.display='none';
                  document.querySelector('.nav-logo-text').style.display='block'">
    <span class="nav-logo-text" style="display:none">Vendrix</span>
  </div>
  <div class="nav-links">
    <a href="index.html" class="active">Products</a>
    <a href="cart.html" class="nav-cart-link">
      Cart
      <span class="cart-count" id="cart-count" style="display:none">0</span>
    </a>
    <a href="orders.html">Orders</a>
    <div class="nav-user" id="nav-user" style="display:none">
      <div class="nav-avatar" id="nav-avatar"></div>
      <span id="nav-username"></span>
    </div>
    <button id="logout-btn" onclick="logout()" style="display:none">Logout</button>
    <a href="auth.html" id="nav-login">Login</a>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">Our Collection</h1>
    <p class="page-subtitle">Discover the latest styles for everyone</p>
  </div>

  <div style="margin-bottom:20px;">
    <div class="gender-pills" id="gender-pills">
      <button class="gender-pill active" data-gender="">All</button>
      <button class="gender-pill" data-gender="men">Men</button>
      <button class="gender-pill" data-gender="women">Women</button>
      <button class="gender-pill" data-gender="kids">Kids</button>
      <button class="gender-pill" data-gender="unisex">Unisex</button>
    </div>
  </div>

  <div class="filters">
    <input type="text" id="search" placeholder="Search products...">
    <select id="category">
      <option value="">All Categories</option>
    </select>
    <input type="number" id="min-price" placeholder="Min $" min="0" style="width:110px">
    <input type="number" id="max-price" placeholder="Max $" min="0" style="width:110px">
    <select id="ordering">
      <option value="-created_at">Newest First</option>
      <option value="price">Price: Low to High</option>
      <option value="-price">Price: High to Low</option>
      <option value="name">Name A–Z</option>
    </select>
    <button class="btn btn-secondary btn-sm" id="search-btn">Search</button>
    <button class="btn btn-ghost btn-sm" id="reset-btn">Reset</button>
  </div>

  <div id="alert" style="display:none"></div>
  <div id="products-container">
    <div class="loading">
      <div class="loading-spinner"></div>
      Loading products...
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script>
  'use strict';

  let activeGender = '';
  const selections  = {};   // product selections
  const sliderState = {};   // current image index

  // Nav
  function initNav() {
    const loggedIn = isLoggedIn();
    const username = localStorage.getItem('username') || '';

    document.getElementById('logout-btn').style.display =
      loggedIn ? 'inline-block' : 'none';
    document.getElementById('nav-login').style.display  =
      loggedIn ? 'none' : 'inline-block';
    document.getElementById('nav-user').style.display   =
      loggedIn ? 'flex' : 'none';

    if (loggedIn && username) {
      document.getElementById('nav-username').textContent = username;
      document.getElementById('nav-avatar').textContent   =
        username.charAt(0).toUpperCase();
    }
  }

  // Toast / Alert
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent   = msg;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => el.style.display = 'none', 2500);
  }

  function showAlert(msg, type) {
    type = type || 'error';
    const el = document.getElementById('alert');
    el.className     = 'alert alert-' + type;
    el.textContent   = msg;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => el.style.display = 'none', 3500);
  }

  // Categories
  async function loadCategories() {
    try {
      const data = await fetchCategories();
      const cats = data.results ?? data;
      const sel  = document.getElementById('category');
      cats.forEach(cat => {
        const opt       = document.createElement('option');
        opt.value       = cat.id;
        opt.textContent = cat.name;
        sel.appendChild(opt);
      });
    } catch (e) {}
  }

  // Gender pills
  document.getElementById('gender-pills').addEventListener('click', e => {
    const btn = e.target.closest('.gender-pill');
    if (!btn) return;
    document.querySelectorAll('.gender-pill')
      .forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    activeGender = btn.dataset.gender;
    loadProducts();
  });

  // Load products
  async function loadProducts() {
    const container = document.getElementById('products-container');
    container.innerHTML =
      '<div class="loading"><div class="loading-spinner"></div>Loading products...</div>';

    const params   = {};
    const search   = document.getElementById('search').value.trim();
    const category = document.getElementById('category').value;
    const minPrice = document.getElementById('min-price').value;
    const maxPrice = document.getElementById('max-price').value;
    const ordering = document.getElementById('ordering').value;

    if (search)       params.search    = search;
    if (category)     params.category  = category;
    if (minPrice)     params.min_price = minPrice;
    if (maxPrice)     params.max_price = maxPrice;
    if (ordering)     params.ordering  = ordering;
    if (activeGender) params.gender    = activeGender;

    try {
      const data     = await fetchProducts(params);
      const products = data.results ?? data;

      if (!products.length) {
        container.innerHTML =
          '<div class="empty-state">' +
          '<h3>No products found</h3>' +
          '<p>Try adjusting your filters</p>' +
          '<button class="btn btn-primary" onclick="resetFilters()">Clear Filters</button>' +
          '</div>';
        return;
      }

      // init selection state for each product
      products.forEach(p => {
        if (!selections[p.id]) {
          selections[p.id] = {
            size:      (p.sizes  && p.sizes.length  > 0) ? p.sizes[0]           : null,
            colorName: (p.colors && p.colors.length > 0) ? p.colors[0].name     : null,
            qty:       1,
          };
        }
        sliderState[p.id] = 0;
      });

      container.innerHTML =
        '<div class="products-grid">' +
        products.map(productCard).join('') +
        '</div>';

    } catch (err) {
      container.innerHTML =
        '<div class="empty-state"><h3>Failed to load</h3><p>' +
        err.message + '</p></div>';
    }
  }

  // Slider helpers
  function slideImage(pid, direction) {
    const slider = document.getElementById('slider-' + pid);
    if (!slider) return;
    const slides = slider.querySelectorAll('.slide');
    const dots   = slider.querySelectorAll('.dot');
    if (!slides.length) return;

    let idx = sliderState[pid] || 0;
    slides[idx].classList.remove('active');
    if (dots[idx]) dots[idx].classList.remove('active');

    idx = (idx + direction + slides.length) % slides.length;
    sliderState[pid] = idx;

    slides[idx].classList.add('active');
    if (dots[idx]) dots[idx].classList.add('active');
  }

  function goToSlide(pid, index) {
    const slider = document.getElementById('slider-' + pid);
    if (!slider) return;
    const slides = slider.querySelectorAll('.slide');
    const dots   = slider.querySelectorAll('.dot');
    if (!slides.length) return;

    let idx = sliderState[pid] || 0;
    slides[idx].classList.remove('active');
    if (dots[idx]) dots[idx].classList.remove('active');

    sliderState[pid] = index;
    slides[index].classList.add('active');
    if (dots[index]) dots[index].classList.add('active');
  }

  // Product card
  function productCard(p) {
    const pid     = p.id;
    const sel     = selections[pid] || { size: null, colorName: null, qty: 1 };
    const inStock = p.stock > 0;

    // collect images
    const allImages = [];

    if (p.images && p.images.length) {
      // sort primary first, then by order
      const sorted = [...p.images].sort((a, b) => {
        if (a.is_primary && !b.is_primary) return -1;
        if (!a.is_primary && b.is_primary) return 1;
        return (a.order || 0) - (b.order || 0);
      });
      sorted.forEach(img => { if (img.image) allImages.push(img.image); });
    }

    // fallback to cover image
    if (!allImages.length && p.image) allImages.push(p.image);

    // image slider HTML
    let imageHtml = '';
    if (allImages.length) {
      const slidesHtml = allImages.map((src, i) =>
        '<div class="slide ' + (i === 0 ? 'active' : '') + '">' +
        '<img src="' + src + '" alt="' + p.name + '" loading="lazy"' +
        ' style="width:100%;height:200px;object-fit:contain;' +
        'background:#f5f5f5;display:block;">' +
        '</div>'
      ).join('');

      const navHtml = allImages.length > 1
        ? '<button class="slide-btn slide-prev" onclick="slideImage(' + pid + ', -1)">&#8249;</button>' +
          '<button class="slide-btn slide-next" onclick="slideImage(' + pid + ', 1)">&#8250;</button>' +
          '<div class="slide-dots">' +
          allImages.map((_, i) =>
            '<span class="dot ' + (i === 0 ? 'active' : '') + '"' +
            ' onclick="goToSlide(' + pid + ', ' + i + ')"></span>'
          ).join('') +
          '</div>'
        : '';

      imageHtml =
        '<div class="slider" id="slider-' + pid + '">' +
        '<div class="slides">' + slidesHtml + '</div>' +
        navHtml +
        '</div>';
    } else {
      imageHtml =
        '<div style="height:200px;display:flex;align-items:center;' +
        'justify-content:center;background:#f5f5f5;">' +
        '<span style="color:#aaa;font-size:12px;">No Image</span>' +
        '</div>';
    }

    // gender badge
    const genderColors = {
      men:    '#dbeafe|#1e40af',
      women:  '#fce7f3|#9d174d',
      kids:   '#dcfce7|#166534',
      unisex: '#f3f4f6|#374151',
    };
    const [gbg, gtx] = (genderColors[p.gender] || '#f3f4f6|#374151').split('|');
    const genderBadge =
      '<span style="background:' + gbg + ';color:' + gtx + ';' +
      'padding:2px 8px;border-radius:10px;font-size:0.72rem;font-weight:700;">' +
      (p.gender
        ? p.gender.charAt(0).toUpperCase() + p.gender.slice(1)
        : '') +
      '</span>';

    // sizes
    let sizesHtml = '';
    if (p.sizes && p.sizes.length > 0) {
      const btns = p.sizes.map(s => {
        const selected = s === sel.size;
        return '<button class="size-btn' + (selected ? ' selected' : '') + '"' +
          ' onclick="selectSize(' + pid + ', this, \'' + s + '\')">' + s + '</button>';
      }).join('');
      sizesHtml =
        '<div class="variants-section" style="padding-bottom:0;">' +
        '<div class="variant-label">Size</div>' +
        '<div class="size-btns">' + btns + '</div>' +
        '</div>';
    }

    // colors
    let colorsHtml = '';
    if (p.colors && p.colors.length > 0) {
      const swatches = p.colors.map(c => {
        const selected = c.name === sel.colorName;
        return '<span class="color-btn' + (selected ? ' selected' : '') + '"' +
          ' style="background:' + c.hex_code + ';"' +
          ' title="' + c.name + '"' +
          ' onclick="selectColor(' + pid + ', this, \'' + c.name + '\')"></span>';
      }).join('');
      colorsHtml =
        '<div class="variants-section">' +
        '<div class="variant-label" id="color-label-' + pid + '">' +
        'Color' +
        (sel.colorName
          ? ' — <span style="font-weight:700;color:var(--text);">' + sel.colorName + '</span>'
          : '') +
        '</div>' +
        '<div class="color-btns">' + swatches + '</div>' +
        '</div>';
    }

    // quantity and add to cart
    const isNew    = (Date.now() - new Date(p.created_at).getTime()) < 7 * 24 * 60 * 60 * 1000;
    const newBadge = isNew    ? '<span class="product-badge badge-new">New</span>' : '';
    const outBadge = !inStock ? '<span class="product-badge badge-out">Out of stock</span>' : '';

    const actions = inStock
      ? '<div class="qty-wrap">' +
          '<button class="qty-btn" onclick="changeQty(' + pid + ', -1, ' + p.stock + ')">−</button>' +
          '<span class="qty-num" id="qty-' + pid + '">' + sel.qty + '</span>' +
          '<button class="qty-btn" onclick="changeQty(' + pid + ', 1, ' + p.stock + ')">+</button>' +
        '</div>' +
        '<button class="btn btn-primary btn-sm" id="atc-' + pid + '"' +
        ' onclick="handleAddToCart(' + pid + ')">Add to Cart</button>'
      : '<span class="out-of-stock" style="width:100%;text-align:center;">Out of stock</span>';

    return '<div class="product-card" id="card-' + pid + '">' +

      '<div class="product-image-wrap">' +
        imageHtml + newBadge + outBadge +
      '</div>' +

      '<div class="card-body">' +
        '<div style="display:flex;justify-content:space-between;' +
             'align-items:center;margin-bottom:6px;">' +
          '<div class="product-category">' + (p.category_name || 'Uncategorized') + '</div>' +
          genderBadge +
        '</div>' +
        '<h3>' + p.name + '</h3>' +
        '<p class="product-desc">' + (p.description || '') + '</p>' +
      '</div>' +

      sizesHtml +
      colorsHtml +

      '<div class="card-price-row">' +
        '<span class="amount" style="font-size:1.3rem;font-weight:800;' +
        'color:var(--primary);">$' + parseFloat(p.price).toFixed(2) + '</span>' +
        '<span style="font-size:0.78rem;color:var(--text-muted);">' +
          (p.stock > 0 ? p.stock + ' left' : '') +
        '</span>' +
      '</div>' +

      '<div class="card-actions">' + actions + '</div>' +

    '</div>';
  }

  // Selection handlers
  function selectSize(pid, btn, size) {
    selections[pid].size = size;
    const card = document.getElementById('card-' + pid);
    card.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }

  function selectColor(pid, swatch, name) {
    selections[pid].colorName = name;

    const card = document.getElementById('card-' + pid);
    card.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
    swatch.classList.add('selected');

    const label = document.getElementById('color-label-' + pid);
    if (label) {
      label.innerHTML =
        'Color — <span style="font-weight:700;color:var(--text);">' + name + '</span>';
    }
  }

  function changeQty(pid, delta, stock) {
    if (!selections[pid]) return;
    let next = (selections[pid].qty || 1) + delta;
    if (next < 1) next = 1;
    if (next > stock) { showToast('Only ' + stock + ' in stock'); return; }
    selections[pid].qty = next;
    const el = document.getElementById('qty-' + pid);
    if (el) el.textContent = next;
  }

  // Add to cart
  async function handleAddToCart(pid) {
    if (!isLoggedIn()) {
      showAlert('Please login to add items to cart!', 'error');
      return;
    }

    const sel = selections[pid] || { size: null, colorName: null, qty: 1 };
    const btn = document.getElementById('atc-' + pid);

    if (btn) { btn.textContent = 'Adding...'; btn.disabled = true; }

    try {
      await addToCart(pid, sel.qty, sel.size, sel.colorName);
      showToast('Added to cart! 🛒');
    } catch (err) {
      showAlert(err.message, 'error');
    } finally {
      if (btn) { btn.textContent = 'Add to Cart'; btn.disabled = false; }
    }
  }

  // Reset filters
  function resetFilters() {
    document.getElementById('search').value    = '';
    document.getElementById('category').value  = '';
    document.getElementById('min-price').value = '';
    document.getElementById('max-price').value = '';
    document.getElementById('ordering').value  = '-created_at';
    activeGender = '';
    document.querySelectorAll('.gender-pill')
      .forEach((p, i) => p.classList.toggle('active', i === 0));
    loadProducts();
  }

  // Event listeners
  document.getElementById('search-btn').addEventListener('click', loadProducts);
  document.getElementById('reset-btn').addEventListener('click', resetFilters);
  document.getElementById('search').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadProducts();
  });

  initNav();
  loadCategories();
  loadProducts();
</script>
</body>
</html>
